<div class="login-page">
    <form [formGroup]="form" (ngSubmit)="submit()" class="login-form">
        <h2>Secure Admin Portal</h2>

        <label>
            Email
            <input formControlName="email" type="email" />
        </label>
        <div class="error" *ngIf="email?.invalid && (email?.touched || email?.dirty)">
            <small *ngIf="email?.errors?.['required']">Email is required.</small>
            <small *ngIf="email?.errors?.['email']">Enter a valid email.</small>
        </div>

        <label>
            Password
            <input formControlName="password" type="password" />
        </label>
        <div class="error" *ngIf="password?.invalid && (password?.touched || password?.dirty)">
            <small *ngIf="password?.errors?.['required']">Password is required.</small>
            <small *ngIf="password?.errors?.['minlength']">Password must be at least 6 characters.</small>
        </div>

        <button type="submit" [disabled]="loading">
            <span *ngIf="!loading">Login</span>
            <!-- <mat-spinner *ngIf="loading" diameter="20" aria-hidden="true"></mat-spinner> -->
            <span *ngIf="loading" aria-hidden="true">Login...</span>
        </button>
        <div class="form-error" *ngIf="errorMsg" style="margin-top:8px;color:#b91c1c;text-align:center;">
            {{ errorMsg }}
        </div>
    </form>
</div>
