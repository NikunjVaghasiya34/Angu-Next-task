<div class="dashboard">
    <header class="topbar">
        <h1>Users</h1>
        <div class="actions">
            <input type="text" [formControl]="searchForm.controls.q" placeholder="Search users..." />
            <button (click)="add()">Add</button>
            <button class="logout" (click)="logout()">Logout</button>
        </div>
    </header>

    <app-loading *ngIf="(loading$ | async)"></app-loading>

    <table *ngIf="users$ | async as users">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let u of users">
                <td>{{u.id}}</td>
                <td>{{u.name}}</td>
                <td>{{u.email}}</td>
                <td>
                    <button (click)="edit(u)">Edit</button>
                    <button (click)="delete(u)">Delete</button>
                </td>
            </tr>
        </tbody>
    </table>
</div>
